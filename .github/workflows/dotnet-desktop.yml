name: .NET Desktop Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VELOPACK_VERSION: "1.2.0"
  PACK_ID: Quiver
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore Quiver.sln

    - name: Test with coverage
      run: dotnet test Quiver.sln -c Release --no-restore --logger "console;verbosity=normal" --blame-hang-timeout 5m --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/coverage"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-cobertura
        path: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
        retention-days: 14

  pack-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      TRUSTED_SIGNING_ENABLED: ${{ vars.AZURE_TRUSTED_SIGNING_ENABLED }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          8.0.x

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' Quiver.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Pack version: $VERSION"

    - name: Publish Windows x64
      run: |
        dotnet publish Quiver.csproj -c Release -r win-x64 --self-contained true -p:PublishTrimmed=false -o publish/win-x64
        Remove-Item publish/win-x64/apps.json -ErrorAction SilentlyContinue

    - name: Install vpk
      run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

    - name: Azure login for Artifact Signing
      if: env.TRUSTED_SIGNING_ENABLED == 'true'
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Write Azure Trusted Signing metadata
      if: env.TRUSTED_SIGNING_ENABLED == 'true'
      shell: pwsh
      run: |
        $json = @"
        {
          "Endpoint": "${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}",
          "CodeSigningAccountName": "${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}",
          "CertificateProfileName": "${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}"
        }
        "@
        [System.IO.File]::WriteAllText("$PWD/signing-metadata.json", $json.Trim(), [System.Text.UTF8Encoding]::new($false))

    - name: Velopack pack (Windows, signed)
      if: env.TRUSTED_SIGNING_ENABLED == 'true'
      shell: pwsh
      run: |
        vpk pack `
          --packId ${{ env.PACK_ID }} `
          --packVersion ${{ steps.ver.outputs.version }} `
          --packDir publish/win-x64 `
          --mainExe Quiver.exe `
          --icon icon.ico `
          --runtime win-x64 `
          --channel win `
          --outputDir releases/win-x64 `
          --azureTrustedSignFile "$PWD/signing-metadata.json"

    - name: Velopack pack (Windows, unsigned)
      if: env.TRUSTED_SIGNING_ENABLED != 'true'
      shell: pwsh
      run: |
        Write-Warning "AZURE_TRUSTED_SIGNING_ENABLED is not 'true'. Windows Velopack packages will be UNSIGNED."
        vpk pack `
          --packId ${{ env.PACK_ID }} `
          --packVersion ${{ steps.ver.outputs.version }} `
          --packDir publish/win-x64 `
          --mainExe Quiver.exe `
          --icon icon.ico `
          --runtime win-x64 `
          --channel win `
          --outputDir releases/win-x64

    - name: Upload Windows Velopack artifacts
      uses: actions/upload-artifact@v4
      with:
        name: velopack-win-x64
        path: releases/win-x64/**
        retention-days: 14

  pack-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
          - rid: linux-arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' Quiver.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish ${{ matrix.rid }}
      run: |
        dotnet publish Quiver.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}
        # Do not bake user-data leftovers into the AppImage.
        rm -f publish/${{ matrix.rid }}/apps.json \
              publish/${{ matrix.rid }}/settings.json \
              publish/${{ matrix.rid }}/games.json \
              publish/${{ matrix.rid }}/game.json \
              publish/${{ matrix.rid }}/crash.log
        rm -rf publish/${{ matrix.rid }}/Apps publish/${{ matrix.rid }}/Cache

    - name: Install vpk
      run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

    - name: Velopack pack (Linux AppImage)
      run: |
        vpk pack \
          --packId ${{ env.PACK_ID }} \
          --packVersion ${{ steps.ver.outputs.version }} \
          --packDir publish/${{ matrix.rid }} \
          --mainExe Quiver \
          --icon Assets/quiver-icon.png \
          --runtime ${{ matrix.rid }} \
          --channel ${{ matrix.rid }} \
          --outputDir releases/${{ matrix.rid }}
        chmod +x releases/${{ matrix.rid }}/*.AppImage

    - name: Upload Linux Velopack artifacts
      uses: actions/upload-artifact@v4
      with:
        name: velopack-${{ matrix.rid }}
        path: releases/${{ matrix.rid }}/**
        retention-days: 14

  pack-macos:
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
          - rid: osx-arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' Quiver.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Publish ${{ matrix.rid }}
      run: |
        dotnet publish Quiver.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}
        rm -f publish/${{ matrix.rid }}/apps.json

    - name: Install vpk
      run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

    # Apple Developer ID + notarization can be wired later via
    # --signAppIdentity / --signInstallIdentity / --notaryProfile / --keychain.
    - name: Velopack pack (macOS)
      run: |
        vpk pack \
          --packId ${{ env.PACK_ID }} \
          --packVersion ${{ steps.ver.outputs.version }} \
          --packDir publish/${{ matrix.rid }} \
          --mainExe Quiver \
          --icon icon.ico \
          --runtime ${{ matrix.rid }} \
          --channel ${{ matrix.rid }} \
          --outputDir releases/${{ matrix.rid }}

    - name: Upload macOS Velopack artifacts
      uses: actions/upload-artifact@v4
      with:
        name: velopack-${{ matrix.rid }}
        path: releases/${{ matrix.rid }}/**
        retention-days: 14

  # Publish Velopack packages to a GitHub Release when a v* tag is pushed.
  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack-windows, pack-linux, pack-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve pack version
      id: ver
      shell: bash
      run: |
        VERSION=$(grep -oE '<Version>[^<]+' Quiver.csproj | head -n1 | sed 's/<Version>//')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [[ "$VERSION" == *-* ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download Velopack artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: velopack-*
        path: release-assets
        merge-multiple: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Install vpk
      run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

    - name: Create GitHub Release shell
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${GITHUB_REF_NAME}"
        NOTES="RELEASE_NOTES.md"
        if [[ ! -f "$NOTES" ]]; then
          NOTES="$(mktemp)"
          echo "Quiver ${{ steps.ver.outputs.version }}" > "$NOTES"
        fi
        PRE_ARGS=()
        if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
          PRE_ARGS+=(--prerelease)
        fi
        gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            --title "Quiver v${{ steps.ver.outputs.version }}" \
            --notes-file "$NOTES" \
            "${PRE_ARGS[@]}"

    - name: Upload Velopack channels to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        PRE_FLAG="false"
        if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
          PRE_FLAG="true"
        fi
        TAG="${GITHUB_REF_NAME}"
        # Each pack job wrote into its own artifact folder (velopack-<rid>/...).
        mapfile -t CHANNEL_DIRS < <(find release-assets -mindepth 1 -maxdepth 1 -type d | sort)
        if [[ ${#CHANNEL_DIRS[@]} -eq 0 ]]; then
          echo "No Velopack artifact directories found under release-assets/"
          ls -laR release-assets || true
          exit 1
        fi
        for dir in "${CHANNEL_DIRS[@]}"; do
          echo "Uploading Velopack assets from $dir"
          # Infer channel from releases.*.json / assets.*.json produced by vpk pack.
          channel_file="$(find "$dir" -maxdepth 1 -name 'releases.*.json' | head -n1 || true)"
          if [[ -z "$channel_file" ]]; then
            echo "No releases.*.json in $dir — skipping"
            ls -la "$dir" || true
            continue
          fi
          channel="$(basename "$channel_file" | sed -E 's/^releases\.(.+)\.json$/\1/')"
          echo "Channel: $channel"
          vpk upload github \
            --outputDir "$dir" \
            --channel "$channel" \
            --repoUrl "${{ env.REPO_URL }}" \
            --token "$GH_TOKEN" \
            --publish true \
            --pre "$PRE_FLAG" \
            --merge true \
            --tag "$TAG" \
            --releaseName "Quiver v${{ steps.ver.outputs.version }}" \
            --targetCommitish "$GITHUB_SHA"
        done
